; ACUnityFirstPerson 0.8.4. Period (.) toggles. Restart after editing.
[Camera]
TrackAnimatedHead=1
HideHead=1
HeadEyeHeight=0.12
HeadForward=0.16
; Fallback eye height; ForwardOffset retained for old configurations.
EyeHeight=1.65
ForwardOffset=0.25
; Vertical degrees, 40-100; 0 preserves native FOV.
VerticalFOV=70
; Relative animation smoothing half-life in seconds.
HeadSmoothingHalfLife=0.07
; Legacy keys: inactive in 0.4.3; native view alignment is preserved.
MaxLookYaw=80
MaxLookDown=60
MaxLookUp=70
; Experimental native physics rays, with world-metre clearance.
CollisionGuard=1
CollisionPadding=0.12
CollisionRadius=0.16

; 0 keeps first person through turns and successful local collision adjustments.
; 1 restores the earlier automatic third-person thresholds.
AutoThirdPerson=0

; Keyboard virtual-key code, configurable in the plugin menu. 190 = period.
ToggleKey=190

; Smooth combat-only framing; offsets are relative to the tracked head.
CombatFraming=1
CombatEyeHeight=-0.06
CombatForward=0.02
CombatVerticalFOV=80

; Follow only recognized ground rolls; ordinary combat keeps native aim.
FollowCombatMotion=1

; Follow the verified Leap of Faith action, independently of combat/roll options.
FollowLeapOfFaith=1
